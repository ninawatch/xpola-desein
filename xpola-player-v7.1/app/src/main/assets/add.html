<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Item Deleted Successfully</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root{
      --brand:#081828;
      --bg:#0b1320;
      --card:#101a2c;
      --text:#e8eef7;
      --muted:#a8b3c7;
      --success:#22c55e;
      --ring: rgba(34,197,94,.35);
      --shadow: 0 10px 30px rgba(0,0,0,.25), 0 6px 12px rgba(8,24,40,.35);
    }
    * { box-sizing: border-box; }
    html,body{
      height:100%;
      margin:0;
      background: radial-gradient(1000px 600px at 20% 10%, rgba(34,197,94,0.10), transparent),
                  radial-gradient(800px 500px at 80% 90%, rgba(8,24,40,0.45), transparent),
                  var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Segoe UI Emoji", "Segoe UI Symbol";
    }
    .center{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      width:min(560px, 92vw);
      background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00)) , var(--card);
      border:1px solid rgba(255,255,255,.06);
      border-radius:24px;
      box-shadow: var(--shadow);
      padding:28px 28px 22px;
      position:relative;
      overflow:hidden;
      animation: pop .5s ease-out;
    }
    .ring{
      position:absolute; inset:-2px; border-radius:inherit; pointer-events:none;
      box-shadow: 0 0 0 6px var(--ring) inset;
      filter: blur(12px);
      opacity:.6;
    }

    @keyframes pop{ from{ transform:translateY(8px) scale(.98); opacity:0 } to{ transform:none; opacity:1 } }
    @keyframes bounceIn{ 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.08);opacity:1} 100%{transform:scale(1)} }
    @keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

    .icon-wrap{
      display:grid; place-items:center; margin-bottom:12px;
    }
    .check{
      width:74px; height:74px; border-radius:50%; background:linear-gradient(180deg, #25d366, #16a34a);
      display:grid; place-items:center; color:white; box-shadow: 0 10px 24px rgba(34,197,94,.35);
      animation: bounceIn .6s cubic-bezier(.2, .8, .2, 1);
    }
    .check svg{ width:38px; height:38px; display:block; }

    h1{
      font-size: clamp(20px, 3vw, 26px);
      margin: 8px 0 6px;
      line-height:1.35;
      text-align:center;
      font-weight:700;
      letter-spacing:.2px;
    }
    p{
      margin:4px 0 0; text-align:center; color:var(--muted);
      font-size:clamp(14px, 2.2vw, 16px);
    }

    .progress{
      margin:18px auto 0; height:8px; width:min(360px, 100%);
      background:rgba(255,255,255,.08); border-radius:999px; overflow:hidden; position:relative;
    }
    .bar{ height:100%; width:0%; background:linear-gradient(90deg, var(--success), #86efac);
      animation: fill 3s linear forwards;
    }
    @keyframes fill{ to{ width:100% } }

    .actions{ display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
    .btn{
      appearance:none; border:none; border-radius:999px; padding:10px 16px; cursor:pointer;
      background:#0e2a1a; color:#d1fae5; font-weight:600; box-shadow: 0 6px 14px rgba(34,197,94,.22);
      transition: transform .15s ease, opacity .2s ease; text-decoration:none; display:inline-flex; align-items:center; gap:8px;
    }
    .btn:focus-visible{ outline:3px solid #a7f3d0; outline-offset:2px }
    .btn:hover{ transform: translateY(-1px) }

    @media (prefers-reduced-motion: reduce){
      .card, .check{ animation:none }
      .bar{ animation-duration: 0.01ms; animation-iteration-count: 1; width:100% }
    }
  </style>
</head>
<body>
  <main class="center">
    <section class="card" role="status" aria-live="polite">
      <span class="ring" aria-hidden="true"></span>
      <div class="icon-wrap">
        <div class="check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M20 7L9 18l-5-5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <h1>Item has been added successfully</h1>
      <p>You will be redirected to the homepage in <strong id="sec">2</strong> seconds.</p>

      <div class="progress" aria-label="Progress to redirect">
        <div class="bar" aria-hidden="true"></div>
      </div>

      <div class="actions">
        <a class="btn" href="../" id="goNow" rel="nofollow">Go Now</a>
      </div>
    </section>
  </main>

  <script>
    (function(){
      const totalMs = 2000;
      const secEl = document.getElementById('sec');
      const start = Date.now();

      const tick = () => {
        const left = Math.max(0, totalMs - (Date.now() - start));
        const s = Math.ceil(left/1000);
        secEl.textContent = s.toString();
        if(left <= 0){
          window.location.href = '../';
        } else {
          requestAnimationFrame(tick);
        }
      };
      tick();

      setTimeout(() => { window.location.href = '../'; }, totalMs + 100);
    })();
  </script>
</body>
</html>
