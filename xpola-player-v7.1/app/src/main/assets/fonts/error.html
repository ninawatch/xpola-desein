<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #081828;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .error-container {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            max-width: 360px;
            width: 100%;
            animation: fadeIn 0.5s ease-in-out;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 15px;
            color: #ff4d4d;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #e0e0e0;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            color: #fff;
            background-color: #ff4d4d;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s ease;
        }
        button:hover {
            background-color: #e60000;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="icon">😔</div>
        <h1>Connection Error</h1>
        <p>Sorry, we couldn't connect to the server. Please check your internet connection or verify the link.</p>
    </div>
</body>
</html>
